<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notary Services | Maximax Multi Services</title>

<style>
:root{
  --orange:#ff7900;
  --apricot:#ffad4d;
  --black:#000000;
  --deep:#050200;
  --soft:#120600;
  --text:#ffd2a3;
  --muted:#d89558;
  --border:rgba(255,121,0,.55);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  background:#000;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 5%,rgba(255,121,0,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(255,173,77,.10),transparent 30%),
    linear-gradient(180deg,#000,#050200 45%,#120600);
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select,
textarea{
  font:inherit;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  padding:10px 15px;
  text-align:center;
  color:#000;
  background:linear-gradient(90deg,#ff7900,#ffad4d,#ff7900);
  font-size:12px;
  font-weight:1000;
  letter-spacing:1.4px;
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(15px);
}

.header-inner{
  min-height:90px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:68px;
  height:68px;
  object-fit:contain;
  padding:4px;
  border:2px solid var(--orange);
  border-radius:17px;
  background:#000;
  box-shadow:0 0 20px rgba(255,121,0,.45);
}

.brand h1{
  color:var(--orange);
  font-size:17px;
  font-weight:1000;
}

.brand small{
  display:block;
  margin-top:5px;
  color:var(--apricot);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.languages{
  display:flex;
  gap:5px;
  padding:5px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#090300;
}

.lang{
  min-height:38px;
  padding:7px 11px;
  border:1px solid transparent;
  border-radius:999px;
  color:var(--apricot);
  background:#000;
  cursor:pointer;
  font-size:11px;
  font-weight:1000;
}

.lang.active{
  color:#000;
  background:linear-gradient(135deg,var(--orange),var(--apricot));
}

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:10px 16px;
  border:2px solid var(--orange);
  border-radius:999px;
  color:var(--orange);
  background:#000;
  font-size:11px;
  font-weight:1000;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  padding:80px 0 55px;
  text-align:center;
}

.hero-badge{
  display:inline-block;
  margin-bottom:20px;
  padding:9px 16px;
  border:1px solid var(--orange);
  border-radius:999px;
  color:var(--orange);
  background:rgba(255,121,0,.07);
  font-size:11px;
  font-weight:1000;
  letter-spacing:1px;
}

.hero h2{
  color:var(--orange);
  font-size:clamp(38px,7vw,72px);
  line-height:1;
  font-weight:1000;
}

.hero p{
  max-width:760px;
  margin:22px auto 0;
  color:var(--text);
  font-size:17px;
  line-height:1
