.doc{font-family:Georgia,'Times New Roman',serif;color:#e8c39a;line-height:1.6;font-size:15px}
.doc-head{text-align:center;border-bottom:3px double #ff7a00;padding-bottom:12px;margin-bottom:18px}

.frow{margin:10px 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.flabel{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;font-weight:700;color:#ff7a00}

p.body{margin:12px 0;text-align:justify}
.statement{border:1px solid #ff7a00;border-radius:6px;background:#0c0703;padding:14px;margin:12px 0;min-height:110px;white-space:normal}
.statement .muted{color:#c99a6b;font-style:italic}
.plist{list-style:none;padding:0;margin:10px 0}
.plist li{margin:6px 0;font-weight:600;color:#ff7a00}
.cert{border:2px solid #ff7a00;border-radius:8px;padding:18px;margin-top:24px;background:#0c0703;page-break-inside:avoid}
.cert h3{font-family:Arial,Helvetica,sans-serif;font-size:13.5px;letter-spacing:1px;color:#ff7a00;margin:0 0 10px;text-transform:uppercase;border-bottom:1px solid #ff7a00;padding-bottom:8px}

.sig{margin-top:28px;page-break-inside:avoid}
.sigline{border-bottom:1px solid #ff7a00;min-height:36px;position:relative;padding-left:26px}
.sigline:before{content:"X";position:absolute;left:2px;bottom:0;font-weight:700;font-family:Arial}
.sigline .script{font-family:'Brush Script MT','Segoe Script',cursive;font-size:26px;color:#ff7a00}
.sigcap{font-family:Arial,Helvetica,sans-serif;font-size:11.5px;color:#c99a6b;margin-top:4px}
.crow{display:flex;gap:10px;align-items:baseline;margin:10px 0;font-family:Arial,Helvetica,sans-serif;font-size:12.5px}
.crow .blank{flex:1}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:520px){.twocol{grid-template-columns:1fr}}
.note{background:#0c0703;border-left:4px solid #ff7a00;padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;margin:16px 0;border-radius:0 6px 6px 0}
table.ctable{width:100%;border-collapse:collapse;margin:14px 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:13px}
table.ctable td,table.ctable th{border:1px solid #ff7a00;padding:9px;text-align:left}

.cmark{text-align:center;font-size:18px}
.cmark.ok{color:#34d399}.cmark.warn{color:#ff7a00}
.legend{font-size:12.5px;font-family:Arial,Helvetica,sans-serif}
