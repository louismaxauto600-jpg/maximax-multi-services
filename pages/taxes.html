:root{
  --orange:#ff7900;
  --orange2:#ff8c1a;
  --apricot:#ffad4d;
  --black:#000;
  --deep:#050200;
  --soft:#120600;
  --text:#ffd2a3;
  --muted:#d89558;
  --border:rgba(255,121,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#000}
body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 5%,rgba(255,121,0,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(255,173,77,.10),transparent 30%),
    linear-gradient(180deg,#000,#050200 45%,#120600);
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color-scheme:dark}
button,a{-webkit-tap-highlight-color:transparent}
.mmx-container{width:min(1180px,92%);margin:auto}
.topbar{
  padding:10px 15px;text-align:center;color:#000;
  background:linear-gradient(90deg,#ff7900,#ffad4d,#ff7900);
  font-size:12px;font-weight:1000;letter-spacing:1.3px;
}
.mmx-header{
  position:sticky;top:0;z-index:1000;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(15px);
}
.header-inner{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:68px;height:68px;object-fit:contain;padding:4px;
  border:2px solid var(--orange);border-radius:17px;background:#000;
  box-shadow:0 0 20px rgba(255,121,0,.45);
  display:flex;align-items:center;justify-content:center;
  color:var(--orange);font-size:34px;font-weight:1000;
}
.brand h1{color:var(--orange);font-size:17px;font-weight:1000}
.brand small{display:block;margin-top:5px;color:var(--apricot);font-size:9px;font-weight:900;letter-spacing:1px}
.header-right{display:flex;align-items:center;gap:10px}
.languages{display:flex;gap:5px;padding:5px;border:1px solid var(--border);border-radius:999px;background:#090300}
.lang{
  min-height:38px;padding:7px 11px;border:1px solid transparent;border-radius:999px;
  color:var(--apricot);background:#000;cursor:pointer;font-size:11px;font-weight:1000;
}
.lang.active{color:#000;border-color:var(--orange);background:linear-gradient(135deg,var(--orange),var(--apricot))}
.back{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:10px 16px;border:2px solid var(--orange);border-radius:999px;
  color:var(--orange);background:#000;font-size:11px;font-weight:1000;cursor:pointer;
}
.hero{padding:75px 0 45px;text-align:center}
.hero-badge{
  display:inline-block;margin-bottom:20px;padding:9px 16px;
  border:1px solid var(--orange);border-radius:999px;color:var(--orange);
  background:rgba(255,121,0,.07);font-size:11px;font-weight:1000;letter-spacing:1px;
}
.hero h2{
  color:var(--orange);font-size:clamp(38px,7vw,72px);line-height:1;font-weight:1000;
  text-shadow:0 0 30px rgba(255,121,0,.25);
}
.hero p{max-width:780px;margin:22px auto 0;font-size:17px;line-height:1.7}
.section{padding:50px 0}
.section-title{margin-bottom:12px;color:var(--orange);text-align:center;font-size:clamp(27px,5vw,44px);font-weight:1000}
.section-subtitle{max-width:800px;margin:0 auto 32px;text-align:center;line-height:1.7}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.service-btn{
  width:100%;min-height:185px;padding:24px;border:2px solid var(--border);border-radius:22px;
  color:var(--text);text-align:left;cursor:pointer;
  background:radial-gradient(circle at 90% 0%,rgba(255,121,0,.14),transparent 35%),linear-gradient(145deg,#100500,#000);
  transition:.2s ease;
}
.service-btn:hover,.service-btn.selected{
  transform:translateY(-3px);border-color:var(--orange);box-shadow:0 0 30px rgba(255,121,0,.25);
}
.service-icon{display:block;margin-bottom:15px;font-size:32px}
.service-btn strong{display:block;margin-bottom:10px;color:var(--orange);font-size:17px;font-weight:1000}
.service-btn small{display:block;font-size:12px;line-height:1.6}
.workspace{
  margin-top:25px;padding:30px;border:2px solid var(--orange);border-radius:28px;
  background:radial-gradient(circle at 90% 5%,rgba(255,173,77,.10),transparent 30%),linear-gradient(145deg,#100500,#000);
  box-shadow:0 0 45px rgba(255,121,0,.13);
}
.workspace-title{margin-bottom:8px;color:var(--orange);font-size:25px;font-weight:1000}
.workspace-subtitle{margin-bottom:25px;color:var(--apricot);font-size:12px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field.full{grid-column:1/-1}
label{color:var(--apricot);font-size:11px;font-weight:1000;letter-spacing:.5px}
input,select,textarea{
  width:100%;min-height:50px;padding:13px 15px;border:1px solid var(--border);
  border-radius:14px;outline:none;color:var(--text);background:#050200;
}
textarea{min-height:115px;resize:vertical}
input::placeholder,textarea::placeholder{color:#9c6538}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,121,0,.12)}
select option{color:var(--text);background:#000}
.checklist{margin-top:30px;padding:24px;border:1px solid var(--border);border-radius:20px;background:#050200}
.checklist h3{margin-bottom:18px;color:var(--orange);font-size:19px}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.check-item{
  display:flex;align-items:flex-start;gap:10px;padding:13px;
  border:1px solid rgba(255,121,0,.30);border-radius:13px;background:#000;cursor:pointer;
}
.check-item input{width:19px;min-width:19px;min-height:19px;margin-top:1px;accent-color:var(--orange)}
.check-item span{font-size:12px;line-height:1.5}
.confirmation{
  display:flex;align-items:flex-start;gap:11px;margin-top:20px;padding:16px;
  border:1px solid var(--border);border-radius:15px;background:#050200;cursor:pointer;
}
.confirmation input{width:20px;min-width:20px;min-height:20px;margin-top:1px;accent-color:var(--orange)}
.confirmation span{font-size:12px;line-height:1.6}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}
.btn{
  min-height:50px;padding:12px 18px;border:2px solid var(--orange);border-radius:999px;
  color:var(--orange);background:#000;cursor:pointer;font-size:11px;font-weight:1000;transition:.2s ease;
}
.btn.primary{color:#000;background:linear-gradient(135deg,var(--orange),var(--apricot))}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(255,121,0,.35)}
.status{
  display:none;margin-top:20px;padding:14px 17px;border:1px solid var(--orange);
  border-radius:14px;color:var(--orange);background:rgba(255,121,0,.07);
  font-size:12px;font-weight:900;
}
.status.show{display:block}
.preview-wrap{margin-top:35px}
.print-document{
  position:relative;overflow:hidden;padding:35px;border:3px solid var(--orange);border-radius:25px;
  color:var(--text);
  background:radial-gradient(circle at 85% 10%,rgba(255,173,77,.18),transparent 30%),linear-gradient(145deg,#120600,#000 65%);
  box-shadow:0 0 35px rgba(255,121,0,.18);
}
.print-document::before,.print-document::after{
  content:"";position:absolute;left:0;right:0;height:8px;
  background:linear-gradient(90deg,var(--orange),var(--apricot),var(--orange));
}
.print-document::before{top:0}
.print-document::after{bottom:0}
.document-head{padding-bottom:20px;margin-bottom:25px;border-bottom:2px solid var(--orange);text-align:center}
.document-head h2{color:var(--orange);font-size:28px}
.document-head h3{margin-top:6px;color:var(--apricot)}
.document-head p{margin-top:8px;font-size:11px}
.document-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.document-item{min-height:75px;padding:14px;border:1px solid var(--border);border-radius:12px;background:#050200}
.document-item.full{grid-column:1/-1}
.document-label{display:block;margin-bottom:7px;color:var(--orange);font-size:10px;font-weight:1000;text-transform:uppercase}
.document-value{font-size:13px;line-height:1.5;word-break:break-word}
.document-footer{margin-top:25px;padding-top:20px;border-top:1px solid var(--orange);color:var(--apricot);text-align:center;font-size:10px;line-height:1.8}
.document-footer strong{color:var(--orange);font-size:13px}
.official-contact{padding:55px 0}
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.contact-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:150px;padding:25px;border:2px solid var(--orange);border-radius:22px;text-align:center;
  background:radial-gradient(circle at 50% 0%,rgba(255,173,77,.12),transparent 45%),linear-gradient(145deg,#120600,#000);
}
.contact-card .icon{margin-bottom:12px;font-size:30px}
.contact-card strong{margin-bottom:10px;color:var(--orange)}
.contact-card span{color:var(--apricot);font-weight:900;word-break:break-word}
.notice{margin-top:30px;padding:20px;border:1px solid var(--border);border-radius:18px;background:#050200;font-size:11px;line-height:1.7}
.notice strong{color:var(--orange)}
.mmx-footer{margin-top:40px;padding:40px 15px;border-top:1px solid var(--border);text-align:center;background:#000}
.mmx-footer strong{color:var(--orange)}
.mmx-footer p{margin-top:8px;color:var(--apricot);font-size:11px}
.mmx-footer a{color:var(--apricot);font-weight:900}
.mmx-toast{
  position:fixed;top:104px;left:50%;transform:translateX(-50%);z-index:2000;
  padding:10px 20px;border:2px solid var(--orange);border-radius:999px;
  background:#0a0400;color:var(--orange);font-size:12px;font-weight:1000;
  letter-spacing:.5px;box-shadow:0 0 25px rgba(255,121,0,.45);
  pointer-events:none;white-space:nowrap;
}
@media(max-width:850px){
  .services{grid-template-columns:repeat(2,1fr)}
  .actions{grid-template-columns:repeat(2,1fr)}
  .back{display:none}
}
@media(max-width:650px){
  .mmx-container{width:94%}
  .header-inner{min-height:80px;gap:8px}
  .brand{gap:8px}
  .logo{width:50px;height:50px;font-size:26px;border-radius:13px}
  .brand h1{max-width:135px;font-size:11px}
  .brand small{display:none}
  .languages{gap:2px;padding:3px}
  .lang{min-height:34px;padding:6px 8px;font-size:9px}
  .hero{padding:55px 0 35px}
  .services,.form-grid,.check-grid,.document-grid,.contact-grid,.actions{grid-template-columns:1fr}
  .field.full,.document-item.full{grid-column:auto}
  .workspace{padding:20px}
  .btn{width:100%}
